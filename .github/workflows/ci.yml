# Merge gate for zeus_client_golang (ZCG-7 / GO_CLIENT_BOOTSTRAP §4).
# Race is required — Pattern A goroutines depend on it.
#
# Pattern A (adapters/jobsma) needs sibling ../koten_multi_agent_golang.
# This workflow does not clone that private repo (no KOTEN_CI_PAT on this
# Actions repo yet). make ci still runs; jobsma is behind -tags patterna
# and is skipped when the sibling go.mod is absent.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make ci (fmt · vet · race · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt already clean
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: make ci
        run: make ci
